name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # PyPI refuses re-uploads, so every release must build a new version.
      # Derive it from the release tag (e.g. "v0.1.1" -> 0.1.1) rather than
      # the dev default in pyproject.toml.
      - name: Set version from release tag
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "release tag '${{ github.event.release.tag_name }}' is not a semantic version" >&2
            exit 1
          }
          sed -i "s/^version = .*/version = \"$version\"/" pyproject.toml

      # Builds inside a manylinux container so the wheel gets a portable
      # manylinux tag instead of a host-specific linux_x86_64 one (PyPI
      # rejects untagged Linux wheels).
      - name: Build release distributions
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --sdist --out dist

      - name: Upload distributions
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: publish
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      url: https://pypi.org/p/dxcore
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        if: ${{ !env.ACT }}

        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        if: ${{ !env.ACT }}

        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
