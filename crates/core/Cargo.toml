[package]
name = "dxcore"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[features]
integration = []
strategies = []
ibkr = ["dep:ibapi"]

[dependencies]
ibapi = { version = "3", optional = true, features = [
  "sync",
], default-features = false }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
dotenvy = "0.15"
polars = { version = "0.46", features = ["dtype-date", "strings", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["time"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "dxcore"
path = "src/main.rs"

[[example]]
name = "strategy"
path = "examples/strategy.rs"
required-features = ["strategies"]

[[example]]
name = "xbrl_poll"
path = "examples/xbrl_poll.rs"

[[example]]
name = "five_factor"
path = "examples/five_factor.rs"
required-features = ["strategies", "ibkr"]

[[example]]
name = "serve_portfolio"
path = "examples/serve_portfolio.rs"
