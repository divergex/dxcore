[workspace]
resolver = "2"
members = ["crates/core", "crates/pybindings"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Keep dev builds lean: full debuginfo made artifacts ~10x bigger (500M+).
# "line-tables-only" keeps file:line in backtraces while dropping the bulk.
[profile.dev]
debug = "line-tables-only"
